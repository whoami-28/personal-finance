<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3615/3615667.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Личные финансы</h1>
            <p class="subtitle">Учет доходов и расходов</p>
        </header>

        <!-- Блок баланса и сводки -->
        <section class="summary-cards">
            <div class="card">
                <span class="card-label">Общий баланс</span>
                <span class="card-value" id="total-balance">0.00 ₽</span>
            </div>
            <div class="card">
                <span class="card-label">Общий доход</span>
                <span class="card-value income-val" id="total-income">+0.00 ₽</span>
            </div>
            <div class="card">
                <span class="card-label">Общий расход</span>
                <span class="card-value expense-val" id="total-expense">-0.00 ₽</span>
            </div>
        </section>

        <div class="main-layout">
            <!-- Левая колонка: Форма и Статистика -->
            <aside class="sidebar">
                <section class="panel">
                    <h2 id="form-heading">Новая операция</h2>
                    <form id="transaction-form">
                        <input type="hidden" id="edit-id">

                        <div class="form-group">
                            <label for="trans-type">Тип</label>
                            <select id="trans-type" required>
                                <option value="income">Доход</option>
                                <option value="expense">Расход</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="trans-title">Название / Описание</label>
                            <input type="text" id="trans-title" placeholder="Например: Зарплата, Продукты" required>
                        </div>

                        <div class="form-group">
                            <label for="trans-amount">Сумма (₽)</label>
                            <input type="number" id="trans-amount" min="0.01" step="0.01" placeholder="0.00" required>
                        </div>

                        <div class="form-group">
                            <label for="trans-category">Категория</label>
                            <select id="trans-category" required>
                                <!-- Опции генерируются динамически в зависимости от типа -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="trans-date">Дата</label>
                            <input type="date" id="trans-date" required>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btn-submit">Добавить</button>
                            <button type="button" class="btn btn-secondary hidden" id="btn-cancel">Отмена</button>
                        </div>
                    </form>
                </section>

                <section class="panel">
                    <h2>Статистика по категориям</h2>
                    <div class="stats-toggle">
                        <button type="button" class="tab-btn active" data-type="expense" id="tab-stat-expense">Расходы</button>
                        <button type="button" class="tab-btn" data-type="income" id="tab-stat-income">Доходы</button>
                    </div>
                    <div id="stats-list" class="stats-list">
                        <!-- Вывод категорий с процентами -->
                    </div>
                </section>
            </aside>

            <!-- Правая колонка: Поиск, фильтры, список операций -->
            <main class="content-panel panel">
                <h2>История операций</h2>

                <!-- Панель инструментов: поиск, фильтры, сортировка -->
                <div class="filters-toolbar">
                    <div class="form-group flex-2">
                        <label for="filter-search">Поиск</label>
                        <input type="text" id="filter-search" placeholder="Поиск по названию...">
                    </div>

                    <div class="form-group">
                        <label for="filter-type">Тип</label>
                        <select id="filter-type">
                            <option value="all">Все</option>
                            <option value="income">Только доходы</option>
                            <option value="expense">Только расходы</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filter-category">Категория</label>
                        <select id="filter-category">
                            <option value="all">Все категории</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="filter-sort">Сортировка</label>
                        <select id="filter-sort">
                            <option value="date-desc">Сначала новые</option>
                            <option value="date-asc">Сначала старые</option>
                            <option value="amount-desc">По сумме (убыв.)</option>
                            <option value="amount-asc">По сумме (возр.)</option>
                        </select>
                    </div>
                </div>

                <!-- Таблица/список транзакций -->
                <div class="table-responsive">
                    <table class="transactions-table">
                        <thead>
                            <tr>
                                <th>Дата</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Тип</th>
                                <th class="text-right">Сумма</th>
                                <th class="text-center">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body">
                            <!-- Рендер элементов списка -->
                        </tbody>
                    </table>
                </div>

                <div id="empty-state" class="empty-state hidden">
                    Операции не найдены
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
